[package]
name = "arknetzwebweaver"
version = "0.4.1"
description = "ArkNetzWebWeaver by STANBEYOND — zero-server, $0/month decentralized web (core shell)"
authors = ["Stanley Garland"]
edition = "2021"

[lib]
name = "arknetzwebweaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
